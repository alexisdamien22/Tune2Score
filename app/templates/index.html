<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tune2Score - Convertisseur</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 40px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #333; }
        .form-group { margin-bottom: 15px; display: inline-block; margin-right: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #27ae60; }
        .btn-pdf { background: #e74c3c; margin-bottom: 20px; display: inline-block; text-decoration: none; }
        .btn-pdf:hover { background: #c0392b; }
        #resultZone { margin-top: 40px; display: none; }
        #actionsZone { margin-bottom: 15px; }
        .score-box { border: 1px solid #eee; background: #fff; padding: 10px; border-radius: 4px; overflow-x: auto; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tune2Score 🎵</h1>
    <p>Uploadez votre fichier audio pour générer instantanément votre partition en SVG maison.</p>
    
    <form id="uploadForm">
        <div class="form-group">
            <label>Fichier Audio (.wav, .mp3)</label>
            <input type="file" id="audioFile" accept="audio/*" required>
        </div>
        <div class="form-group">
            <label>Tempo (BPM)</label>
            <input type="number" id="tempo" value="130" min="40" max="240">
        </div>
        <div class="form-group">
            <label>Signature</label>
            <select id="timeSignature">
                <option value="4/4">4/4</option>
                <option value="3/4">3/4</option>
            </select>
        </div>
        <button type="submit">Générer la partition</button>
    </form>

    <div id="resultZone">
        <h2>Votre Partition :</h2>
        
        <div id="actionsZone"></div>
        
        <div class="score-box" id="svgContainer"></div>
    </div>
</div>

<script>
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const fileInput = document.getElementById('audioFile');
    const tempo = document.getElementById('tempo').value;
    const timeSignature = document.getElementById('timeSignature').value;
    
    const formData = new FormData();
    formData.append('audio', fileInput.files[0]);
    formData.append('tempo', tempo);
    formData.append('time_signature', timeSignature);

    // Reset et état de chargement
    document.getElementById('actionsZone').innerHTML = "";
    document.getElementById('svgContainer').innerHTML = "Analyse et tracé en cours...";
    document.getElementById('resultZone').style.display = "block";

    try {
        // 1. Envoi des données à notre API FastAPI
        const response = await fetch('http://127.0.0.1:8000/api/upload', {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            throw new Error("Erreur lors du traitement du fichier par le serveur.");
        }
        
        const data = await response.json();
        
        // 2. Récupération du SVG propre depuis l'URL dédiée
        const svgResponse = await fetch(data.svg_url);
        const svgCode = await svgResponse.text();
        
        // 3. Ajout du bouton PDF si l'URL est fournie
        if (data.pdf_url) {
            document.getElementById('actionsZone').innerHTML = `
                <a href="${data.pdf_url}" target="_blank" style="text-decoration: none;">
                    <button type="button" class="btn-pdf">Télécharger en PDF 📄</button>
                </a>
            `;
        }
        
        // 4. Injection directe du code XML du SVG dans la page web
        document.getElementById('svgContainer').innerHTML = svgCode;

    } catch (error) {
        document.getElementById('svgContainer').innerHTML = "Erreur lors de la génération.";
        console.error(error);
    }
});
</script>
</body>
</html>
