{% extends 'base.html' %}

{% block title %}Tune2Score - Convertisseur{% endblock %}

{% block content %}
<div class="converter-box">
    <h1>Convertisseur de musique</h1>
    <p class="subtitle">Uploadez votre fichier audio pour générer instantanément votre partition en SVG maison.</p>

    <form id="uploadForm">
        <div class="form-group">
            <label for="audioFile">Fichier Audio (.wav, .mp3)</label>
            <input type="file" id="audioFile" accept="audio/*" required>
        </div>
        
        <div class="form-group">
            <label for="tempo">Tempo (BPM)</label>
            <input type="number" id="tempo" value="130" min="40" max="240">
        </div>
        
        <div class="form-group">
            <label for="timeSignature">Signature</label>
            <select id="timeSignature">
                <option value="4/4">4/4</option>
                <option value="3/4">3/4</option>
            </select>
        </div>
        
        <button type="submit" class="btn-submit">Générer la partition</button>
    </form>

    <div id="resultZone">
        <h2>Votre Partition :</h2>
        <div id="actionsZone"></div>
        <div class="score-box" id="svgContainer"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/upload.js"></script>
{% endblock %}
